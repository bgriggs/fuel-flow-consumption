; PlatformIO build for the CANBed Elite (ATmega32U4).
;
; An alternative to the Arduino IDE, not a replacement: both build the same
; sources. PlatformIO pins the toolchain and fetches the CAN library itself,
; and it does not care that no .ino file matches the folder name, which the
; Arduino IDE does.
;
;   pio run                build
;   pio run -t upload      build and flash
;   pio device monitor     serial console
;
; The host unit tests are not built here; use the Makefile in test/.

; The sketch (.ino) lives at the repository root, while src/ holds the pure
; C++ core. PlatformIO's default src_dir of "src" would therefore compile the
; core and never see setup() or loop(). This has to be a project-level option;
; PlatformIO silently ignores src_dir inside an [env:] section.
[platformio]
src_dir = .

[env:canbed_elite]
platform = atmelavr
framework = arduino

; There is no CANBed board definition upstream. The CANBed Elite is an
; ATmega32U4 at 16 MHz with the Caterina bootloader - electrically a Leonardo,
; which is also what this sketch is selected as in the Arduino IDE.
board = leonardo

; With src_dir pointing at the repository root, name exactly what is
; firmware. The exclusions matter: test/ brings its own main() and the host
; test framework, and build-avr/ holds a generated copy of the whole sketch,
; so either would collide with the real sources.
build_src_filter =
    +<*>
    -<test/>
    -<tools/>
    -<build-avr/>
    -<.pio/>

; The sketch includes <mcp_can.h>. Longan later renamed that header to
; mcp_canbus.h, so the current upstream repo will NOT satisfy this include -
; pulling it from GitHub gets a library that looks right and does not compile.
; Use the copy already installed in the Arduino sketchbook, which is the exact
; version the Arduino IDE builds against, so both toolchains produce the same
; firmware.
;
; Both of the usual sketchbook locations are listed; a path that does not
; exist is ignored. If your sketchbook is elsewhere, point this at it, or copy
; the library into lib/ to make the project self-contained.
lib_extra_dirs =
    ${sysenv.USERPROFILE}/OneDrive/Documents/Arduino/libraries
    ${sysenv.USERPROFILE}/Documents/Arduino/libraries

monitor_speed = 115200

; Uploading to a 32U4 works by opening the port at 1200 baud to trigger the
; bootloader, which PlatformIO handles. If it cannot find the board, set the
; port explicitly - it changes between the sketch and the bootloader:
; upload_port = COM5
